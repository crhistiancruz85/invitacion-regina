<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Cumpleaños - Regina Sofia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        .instruction {
            font-size: 1rem;
            color: #555;
            margin-bottom: 15px;
            font-weight: 500;
            background: #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .card-container {
            width: 100%;
            aspect-ratio: 1.58 / 1; /* Proporción estándar de una credencial */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .card-container.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
        }
        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .actions {
            margin-top: 25px;
        }
        .btn-maps {
            display: inline-flex;
            align-items: center;
            background-color: #e91e63;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
            transition: all 0.3s ease;
        }
        .btn-maps:hover {
            background-color: #c2185b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        }
        .btn-maps svg {
            margin-right: 8px;
            fill: white;
            width: 20px;
            height: 20px;
        }

 /* Botón flotante para silenciar/reproducir música */

 .btn-audio {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 12px 20px;
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #d81b60;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-audio:active {
            transform: scale(0.95);
        }


    </style>
</head>
<body>

<!-- Encabezados del Sitio -->

    <div class="container">
    <h1>Invitación de Cumpleaños de Regina</h1>
    <div class="instruction">✨ Toca la credencial para voltearla ✨</div>
    
 <!-- Estructura de la Credencial Interactiva (Frente y Reverso) -->

    <div class="card-container" id="invitationCard" onclick="flipCard()">
        <!-- LADO FRONTAL (FRENTE) -->
        <div class="card-face card-front">
            <!-- Usamos codificación Base64 embebida o rutas locales limpias. Al guardarse el archivo, el usuario puede vincularlas o verlas directamente si las renombra al lado del html -->
            <img src="frente.png" alt="Frente de la invitación" onerror="this.src='https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=1000&auto=format&fit=crop'; console.log('Para ver tus imágenes exactas en local, guarda la imagen del frente como frente.png en la misma carpeta.');">
        </div>
        
        <!-- LADO TRASERO (REVERSO) -->
        <div class="card-face card-back">
            <img src="reverso.png" alt="Reverso de la invitación" onerror="this.src='https://images.unsplash.com/photo-1530103862676-de8c9debad1d?q=80&w=1000&auto=format&fit=crop'; console.log('Para ver tus imágenes exactas en local, guarda la imagen del reverso como reverso.png en la misma carpeta.');">
        </div>
    </div>

    <div class="actions">
        <a href="https://www.google.com/maps/search/?api=1&query=Cafeteria+Ixchel" target="_blank" class="btn-maps">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            Ver ubicación en Google Maps
        </a>
<!-- Elemento del Reproductor de Audio (Oculto) en Bucle Infinito -->
    <audio id="musica-fondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta elementos de audio.
    </audio>

  <!-- Botón Flotante del Reproductor -->
    <button class="btn-audio" id="control-audio" onclick="toggleMusica(event)">
        🎵 Reproducir Música
    </button>

    </div>
</div>

<script>
    function flipCard() {
        const card = document.getElementById('invitationCard');
        card.classList.toggle('is-flipped');
    }
</script>

<script>
        // Lógica para girar la tarjeta al hacer clic
        function voltearTarjeta() {
            const tarjeta = document.getElementById('tarjeta');
            tarjeta.classList.toggle('volteada');
        }

        // Lógica para el control del audio
        const musica = document.getElementById('musica-fondo');
        const botonAudio = document.getElementById('control-audio');

        // Intenta iniciar la música al primer toque en cualquier parte de la pantalla
        document.addEventListener('click', () => {
            if (musica.paused && botonAudio.innerText === "🎵 Reproducir Música") {
                musica.play().catch(error => {
                    console.log("La autoreproducción requiere interacción directa con el botón flotante.");
                });
                botonAudio.innerHTML = "🔊 Silenciar";
            }
        }, { once: true }); // Solo se ejecuta una vez para no interferir después

        // Función del botón flotante (Play / Pause / Silenciar)
        function toggleMusica(evento) {
            evento.stopPropagation(); // Evita que la tarjeta se voltee al presionar el botón de música
            
            if (musica.paused) {
                musica.play();
                botonAudio.innerHTML = "🔊 Silenciar";
            } else {
                musica.pause();
                botonAudio.innerHTML = "🔈 Reproducir";
            }
        }
    </script>


</body>
</html>
